[package]
name = "assas"
version = "0.3.0"
edition = "2024"
description = "See which program on your Linux machine talks to whom, from inside the kernel (eBPF)."
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.11"
libbpf-rs = "0.27.2"
libc = "0.2.191"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"

[features]
# Release builds: libbpf, libelf and zlib compiled in, so the binary only needs glibc.
static = ["libbpf-rs/static", "libbpf-rs/vendored"]

[build-dependencies]
libbpf-cargo = "0.27.2"

[[bin]]
name = "3assas"
path = "src/main.rs"

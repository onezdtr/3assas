name: release

# A tag v* builds self-contained binaries (libbpf, libelf, zlib linked in; glibc >= 2.35) for x86_64 and
# aarch64, runs the tests, and publishes them with the agent as a GitHub release that get.sh installs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64, bpftool: amd64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64, bpftool: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm autoconf automake autopoint libtool flex bison gawk pkg-config make

      - name: bpftool (generates vmlinux.h from the runner kernel's BTF)
        run: |
          v=v7.8.1
          f=bpftool-$v-${{ matrix.bpftool }}.tar.gz
          curl -fsSLO https://github.com/libbpf/bpftool/releases/download/$v/$f
          curl -fsSLO https://github.com/libbpf/bpftool/releases/download/$v/$f.sha256sum
          sha256sum -c $f.sha256sum
          tar xzf $f
          sudo install -m 755 bpftool /usr/local/bin/bpftool

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        run: |
          cargo build --release --features static
          cargo test --release --features static
          cd agent && python3 -m unittest test_agent

      - name: Package
        run: |
          d=3assas-${GITHUB_REF_NAME}-${{ matrix.arch }}
          mkdir "$d"
          cp target/release/3assas install.sh LICENSE README.md "$d/"
          cp -r agent systemd "$d/"
          rm -rf "$d/agent/__pycache__" "$d/agent/test_agent.py"
          ldd "$d/3assas"
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: 3assas-*.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" 3assas-*.tar.gz* --repo "$GITHUB_REPOSITORY" --title "3assas $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
